apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: "default"
spec:
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
      - name: mongo
        image: mongo
        resources:
          limits:
            memory: "1Gi"
            cpu: "2"
        ports:
        - containerPort: 27017
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          value: "admin"
        - name: MONGO_INITDB_ROOT_PASSWORD
          value: "password"
        readinessProbe:
          tcpSocket:
            port: 27017
          initialDelaySeconds: 60
          periodSeconds: 10
          failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-svc
  namespace: "default"
spec:
  type: ClusterIP
  selector:
    app: mongo
  ports:
  - port: 27017
    protocol: TCP
    targetPort: 27017

